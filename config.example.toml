# VoidB configuration file example.
#
# Location: ~/.config/voidb/config.toml. This file is optional; when it is
# absent, VoidB uses the built-in defaults shown below.
#
# Connections are NOT configured in this file. Connection profiles and their
# credentials are managed by the native Connection Manager TUI (`voidb`) and
# the `voidb-cli profile` commands, and stored encrypted in
# ~/.config/voidb/profiles.json and ~/.config/voidb/credentials.json.

# General settings. All fields are optional; defaults are shown.
[settings]
# Rows displayed per page in data grids.
page_size = 100

# Maximum number of concurrent database connections.
max_connections = 5

# Credential protection metadata. Written by VoidB when you enable
# master-passphrase protection in the Connection Manager; never edit it by
# hand. When absent, credentials use the built-in default passphrase.
# `mode` is one of: "default_passphrase", "user_passphrase", "migrated".
# `verifier` is an app-generated encrypted blob used to check the master
# password; it contains no credentials.
# [credential_protection]
# version = 1
# mode = "user_passphrase"
# verifier = "..."

# Legacy note: a `[[connections]]` array left over from pre-profile versions
# of VoidB is only read as a migration source. Import it once with
# `voidb-cli profile migrate apply`, then manage profiles through the TUI or
# `voidb-cli profile`. Do not add new connections by hand.
