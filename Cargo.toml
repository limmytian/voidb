[workspace]
resolver = "2"
default-members = ["crates/voidb-tui"]
# voidb-sync-server is a separate, standalone crate (has its own [workspace]).
# It lives here for convenience but is not part of the main voidb workspace.
exclude = ["voidb-sync-server"]
members = [
    "crates/voidb-core",
    "crates/voidb-process-plugin-sdk",
    "crates/voidb-tui",
    "crates/voidb-cli",
    "crates/plugins/voidb-plugin-sync",
]

[workspace.package]
version = "0.3.6"
edition = "2024"
authors = ["limmytian <limmytian@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/limmytian/voidb"
homepage = "https://github.com/limmytian/voidb"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }

# TUI dependencies
ratatui = { version = "0.29", features = ["crossterm", "all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Encryption dependencies
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
zeroize = "1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# JSON Schema validation
# Local file-ref schema validation only; resolve-http would drag reqwest
# into every SDK consumer.
jsonschema = { version = "0.26", default-features = false, features = ["resolve-file"] }

# NOTE: no database drivers here by design — all database drivers live in
# their respective voidb-plugin-* repositories, never in the core workspace.

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
semver = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
