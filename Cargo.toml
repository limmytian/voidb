[workspace]
resolver = "2"
default-members = ["crates/voidb-tui"]
# voidb-sync-server is a separate, standalone crate (has its own [workspace]).
# It lives here for convenience but is not part of the main voidb workspace.
exclude = ["voidb-sync-server"]
members = [
    "crates/voidb-core",
    "crates/voidb-process-plugin-sdk",
    "crates/voidb-tui",
    "crates/voidb-cli",
    "crates/plugins/voidb-plugin-sync",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["limmytian <limmytian@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/limmytian/voidb"
homepage = "https://github.com/limmytian/voidb"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }

# TUI dependencies
ratatui = { version = "0.29", features = ["crossterm", "all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Encryption dependencies
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
rand_core = { version = "0.6", features = ["std"] }

# JSON Schema validation
jsonschema = "0.26"

# Use specialized drivers for each database
mysql_async = "0.34"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
semver = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
