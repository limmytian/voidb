[[capabilities.authorization.approval_schema.fields]]
path = "/collection"
label = "Collection"
value_type = "resource_id"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities]]
id = "cursor_read"
description = "Read a persistent MongoDB find or aggregation cursor with source-paced batches."
input_schema = "schemas/cursor_read-input.schema.json"
output_schema = "schemas/cursor_read-output.schema.json"
permissions = [
    "connection.read",
    "mongodb.documents.find",
]
risk = "read_only"
destructive = false
streaming = true
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
note = "MongoDB live cursors are isolated from run_command transaction sessions; resource scope and resume tokens are revalidated at open."
capability_wide_allowed = true

[[capabilities.authorization.session_purposes]]
kind = "database_query"

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/resource/database"
label = "Database"
value_type = "resource_id"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/resource/collection"
label = "Collection"
value_type = "resource_id"
required = true
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/parameters/filter"
label = "Query or change filter"
value_type = "json"
required = false
constraint = "subset"
risk_emphasis = "normal"

[capabilities.session_handoff]
capabilities = ["mongodb.cursor_read"]

[capabilities.session_handoff.purpose]
kind = "database_query"

[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "read_only"

[capabilities.session_handoff.live_session.kind]
kind = "cursor"

[capabilities.session_handoff.live_session.resource]
resource_type = "mongodb_collection_cursor"
identity_fields = [
    "/database",
    "/collection",
]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
type = "object"
required = [
    "database",
    "collection",
]
additionalProperties = false

[capabilities.session_handoff.live_session.resource.identity_schema.properties.database]
type = "string"
minLength = 1
maxLength = 256

[capabilities.session_handoff.live_session.resource.identity_schema.properties.collection]
type = "string"
minLength = 1
maxLength = 256

[capabilities.session_handoff.live_session.start_parameters_schema]
type = "object"
additionalProperties = false

[capabilities.session_handoff.live_session.start_parameters_schema.properties.mode]
type = "string"
enum = [
    "find",
    "aggregate",
]
default = "find"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.filter]
type = "object"
additionalProperties = true

[capabilities.session_handoff.live_session.start_parameters_schema.properties.pipeline]
type = "array"
maxItems = 64

[capabilities.session_handoff.live_session.start_parameters_schema.properties.pipeline.items]
type = "object"
additionalProperties = true

[capabilities.session_handoff.live_session.start_parameters_schema.properties.sort]
type = "object"
additionalProperties = true

[capabilities.session_handoff.live_session.start_parameters_schema.properties.batch_size]
type = "integer"
minimum = 1
maximum = 500
default = 100

[capabilities.session_handoff.live_session.start_parameters_schema.properties.max_time_ms]
type = "integer"
minimum = 1
maximum = 30000
default = 30000

[capabilities.session_handoff.live_session.event_schema]
type = "object"
required = [
    "document",
    "document_omitted",
]
additionalProperties = false

[capabilities.session_handoff.live_session.event_schema.properties.document]

[capabilities.session_handoff.live_session.event_schema.properties.document_omitted]
type = "boolean"

[capabilities.session_handoff.live_session.operations]
events = "mongodb.cursor_read"

[capabilities.session_handoff.live_session.buffer]
max_events = 500
max_bytes = 2097152
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "never"
max_attempts = 0
initial_backoff_ms = 0
max_backoff_ms = 0
resume = "unsupported"

[capabilities.session_handoff.live_session.delivery]
backpressure = "source_paced"
cursor_scope = "optional"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]

[capabilities.session_handoff.live_session.control]
cancel = "call_and_source"
close = "stop_observation"

[[capabilities]]
id = "change_stream_read"
description = "Read a MongoDB collection change stream with scoped resume tokens."
input_schema = "schemas/change_stream_read-input.schema.json"
