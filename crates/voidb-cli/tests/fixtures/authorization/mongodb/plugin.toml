id = "mongodb"
name = "MongoDB Document Database Plugin"
version = "0.3.3"
protocol_version = "1"
description = "MongoDB database, collection, document, and aggregation capability plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-mongodb"

[runtime]
command = "voidb-plugin-mongodb"
args = ["serve"]
transport = "stdio-jsonrpc"

[runtime.env]

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = [
    "password",
    "client_certificate",
    "cloud_access_key",
    "cloud_secret_key",
]

[[capabilities]]
id = "diagnostics"
description = "Return agent-safe MongoDB profile diagnostics without opening a cluster connection."
input_schema = "schemas/diagnostics-input.schema.json"
output_schema = "schemas/diagnostics-output.schema.json"
permissions = [
    "connection.read",
    "mongodb.diagnostics",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
capability_wide_allowed = true

[[capabilities]]
id = "databases"
description = "List MongoDB databases with bounded, cursor-based output."
input_schema = "schemas/databases-input.schema.json"
output_schema = "schemas/databases-output.schema.json"
permissions = [
    "connection.read",
    "mongodb.databases.list",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
capability_wide_allowed = true

[[capabilities]]
id = "collections"
description = "List MongoDB collections in one database with bounded output."
input_schema = "schemas/collections-input.schema.json"
output_schema = "schemas/collections-output.schema.json"
permissions = [
    "connection.read",
    "mongodb.collections.list",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/database"
label = "Database"
value_type = "resource_id"
required = true
