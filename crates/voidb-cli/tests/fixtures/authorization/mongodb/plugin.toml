[capabilities.session_handoff.purpose]
kind = "watch_stream"

[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "read_only"

[capabilities.session_handoff.live_session.kind]
kind = "cursor"

[capabilities.session_handoff.live_session.resource]
resource_type = "mongodb_change_stream"
identity_fields = [
    "/database",
    "/collection",
]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
type = "object"
required = [
    "database",
    "collection",
]
additionalProperties = false

[capabilities.session_handoff.live_session.resource.identity_schema.properties.database]
type = "string"
minLength = 1
maxLength = 256

[capabilities.session_handoff.live_session.resource.identity_schema.properties.collection]
type = "string"
minLength = 1
maxLength = 256

[capabilities.session_handoff.live_session.start_parameters_schema]
type = "object"
additionalProperties = false

[capabilities.session_handoff.live_session.start_parameters_schema.properties.pipeline]
type = "array"
maxItems = 32

[capabilities.session_handoff.live_session.start_parameters_schema.properties.pipeline.items]
type = "object"
additionalProperties = true

[capabilities.session_handoff.live_session.start_parameters_schema.properties.batch_size]
type = "integer"
minimum = 1
maximum = 500
default = 100

[capabilities.session_handoff.live_session.start_parameters_schema.properties.max_await_ms]
type = "integer"
minimum = 250
maximum = 30000
default = 5000

[capabilities.session_handoff.live_session.start_parameters_schema.properties.full_document]
type = "boolean"
default = false

[capabilities.session_handoff.live_session.event_schema]
type = "object"
required = [
    "operation_type",
    "namespace",
    "document_key",
    "document_key_omitted",
    "full_document",
    "update_description",
    "update_description_omitted",
    "cluster_time",
    "wall_time",
    "resume_token_omitted",
    "session_metadata_omitted",
]
additionalProperties = false

[capabilities.session_handoff.live_session.event_schema.properties.operation_type]
type = "string"

[capabilities.session_handoff.live_session.event_schema.properties.namespace]
type = [
    "object",
    "null",
]

[capabilities.session_handoff.live_session.event_schema.properties.document_key]

[capabilities.session_handoff.live_session.event_schema.properties.document_key_omitted]
type = "boolean"

[capabilities.session_handoff.live_session.event_schema.properties.full_document]

[capabilities.session_handoff.live_session.event_schema.properties.update_description]

[capabilities.session_handoff.live_session.event_schema.properties.update_description_omitted]
type = "boolean"

[capabilities.session_handoff.live_session.event_schema.properties.cluster_time]
type = [
    "string",
    "null",
]

[capabilities.session_handoff.live_session.event_schema.properties.wall_time]
type = [
    "string",
    "null",
]

[capabilities.session_handoff.live_session.event_schema.properties.resume_token_omitted]
const = true

[capabilities.session_handoff.live_session.event_schema.properties.session_metadata_omitted]
const = true

[capabilities.session_handoff.live_session.operations]
events = "mongodb.change_stream_read"

[capabilities.session_handoff.live_session.buffer]
max_events = 500
max_bytes = 2097152
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "transient"
max_attempts = 3
initial_backoff_ms = 250
max_backoff_ms = 2000
resume = "exact_cursor"
cursor_kind = "opaque"

[capabilities.session_handoff.live_session.delivery]
backpressure = "source_paced"
cursor_scope = "required"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]
interval_ms = 10000
idle_timeout_ms = 60000

[capabilities.session_handoff.live_session.control]
cancel = "call_and_source"
close = "stop_observation"

