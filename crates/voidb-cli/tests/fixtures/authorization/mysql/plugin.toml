value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "privilege_escalation"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_path"
label = "Relative local SQL transfer path"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "normal"

[[capabilities]]
id = "import_plan"
description = "Preview one bounded MySQL import batch from an approved local source."
input_schema = "schemas/import_plan-input.schema.json"
