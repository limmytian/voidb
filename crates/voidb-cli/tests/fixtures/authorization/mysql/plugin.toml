[[capabilities.authorization.approval_schema.fields]]
path = "/local_path"
label = "Relative local SQL transfer path"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "normal"

[[capabilities]]
id = "import_apply"
description = "Apply one acknowledged MySQL import batch from an approved local source."
input_schema = "schemas/import_apply-input.schema.json"
output_schema = "schemas/import_apply-output.schema.json"
permissions = [
    "connection.read",
    "sql.import.apply",
    "local.read",
]
risk = "destructive"
destructive = true
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 60000

[capabilities.authorization]
declared = true
interactive_execute = true
note = "Local SQL transfer paths are root-relative, no-follow, and revalidated during every read or atomic no-replace write."
