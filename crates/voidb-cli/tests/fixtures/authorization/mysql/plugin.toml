version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/table"
label = "Target table"
value_type = "resource_id"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/database"
label = "Database"
value_type = "resource_id"
required = false
constraint = "exact"
risk_emphasis = "normal"

