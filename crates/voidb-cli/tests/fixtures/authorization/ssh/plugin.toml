output_schema = "schemas/sftp_put-output.schema.json"
permissions = [
    "connection.write",
    "sftp.write",
    "local.read",
]
risk = "destructive"
destructive = true
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
