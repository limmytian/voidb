[package]
name = "voidb-cli"
version = "0.3.1"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "VoidB CLI with JSON output support"

[[bin]]
name = "voidb-cli"
path = "src/main.rs"

[dependencies]
voidb-core = { path = "../voidb-core" }
voidb-plugin-sync = { path = "../plugins/voidb-plugin-sync", optional = true }

clap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
semver = { workspace = true }
uuid = { workspace = true }
rpassword = "7"

[features]
default = []
sync = ["dep:voidb-plugin-sync"]
full = ["sync"]

[dev-dependencies]
toml = "0.8"
