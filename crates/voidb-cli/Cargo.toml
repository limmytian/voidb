[package]
name = "voidb-cli"
version = "0.3.1"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "VoidB CLI with JSON output support"

[[bin]]
name = "voidb-cli"
path = "src/main.rs"

[dependencies]
voidb-core = { path = "../voidb-core" }
voidb-plugin-mysql = { path = "../plugins/voidb-plugin-mysql", optional = true }
voidb-plugin-postgres = { path = "../plugins/voidb-plugin-postgres", optional = true }
voidb-plugin-sqlite = { path = "../plugins/voidb-plugin-sqlite", optional = true }
voidb-plugin-redis = { path = "../plugins/voidb-plugin-redis", optional = true }
voidb-plugin-ssh = { path = "../plugins/voidb-plugin-ssh", optional = true }
voidb-plugin-duckdb = { path = "../plugins/voidb-plugin-duckdb", optional = true }
voidb-plugin-sync = { path = "../plugins/voidb-plugin-sync", optional = true }

clap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
semver = { workspace = true }
uuid = { workspace = true }
rpassword = "7"

[features]
default = ["mysql", "postgres", "sqlite", "redis", "ssh"]
mysql = ["dep:voidb-plugin-mysql"]
postgres = ["dep:voidb-plugin-postgres"]
sqlite = ["dep:voidb-plugin-sqlite"]
redis = ["dep:voidb-plugin-redis"]
ssh = ["dep:voidb-plugin-ssh"]
duckdb = ["dep:voidb-plugin-duckdb"]
sync = ["dep:voidb-plugin-sync"]
all-dbs = ["mysql", "postgres", "sqlite", "redis", "duckdb"]
all-infra = ["ssh"]
full = ["all-dbs", "all-infra", "sync"]

[dev-dependencies]
toml = "0.8"
