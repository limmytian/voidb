[package]
name = "voidb-core"
version = "0.3.6"
edition = "2024"
license.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# TUI (only for the in-repo shell Plugin trait family; the plugin SDK builds
# with default-features = false and skips the terminal stack entirely)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# Encryption
aes-gcm = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
sha2 = "0.10"
zeroize = { workspace = true }
keyring = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }

# Common dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
csv = { workspace = true }
clap = { workspace = true, optional = true }
toml = "0.8"
dirs = "6.0"
reqwest = { workspace = true, optional = true }

once_cell = "1.19"
unicode-width = "0.2"
arboard = { version = "3", optional = true }
shellexpand = "3.1.2"
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"

[features]
default = ["tui", "cli", "registry"]
# Terminal/clipboard stack: Plugin trait family, widgets, SQL highlighting,
# clipboard and shell capabilities. External process plugins never need it.
tui = ["dep:ratatui", "dep:crossterm", "dep:arboard"]
# clap-based in-shell CLI plugin trait family.
cli = ["dep:clap"]
# Official registry HTTP download support (reqwest). Index parsing and
# signature verification work without it.
registry = ["dep:reqwest"]
