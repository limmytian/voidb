[package]
name = "voidb-plugin-kubernetes"
version = "0.3.0-rc.1"
edition = "2024"
license.workspace = true

[dependencies]
voidb-core = { path = "../../voidb-core" }
kube = { version = "0.99", features = ["client", "config", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_32"], default-features = false }
async-trait = { workspace = true }
anyhow = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
pem = "3"
tokio = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
chrono = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
http = "1"
ratatui = { workspace = true }
crossterm = { workspace = true }
dirs = "6.0"

[dev-dependencies]
uuid = { workspace = true }

[[example]]
name = "kubernetes_fixture_smoke"
path = "examples/fixture_smoke.rs"
