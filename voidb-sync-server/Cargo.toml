[package]
name = "voidb-sync-server"
version = "0.3.1"
edition = "2024"
authors = ["limmytian <limmytian@gmail.com>"]
description = "VoidB Sync Server - E2E encrypted config & data sync service"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

argon2 = "0.5"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.5"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Make sure this is a standalone crate, not part of the voidb workspace.
[workspace]
