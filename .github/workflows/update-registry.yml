name: Update Plugin Registry Index

on:
  repository_dispatch:
    types: [plugin_released, update_registry]
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "Optional specific plugin ID to update (leave empty for full sync)"
        required: false
        default: ""
      version:
        description: "Plugin release version to index (e.g. v0.3.5); required — there is no fallback default"
        required: false
        default: ""

jobs:
  update-registry:
    name: Build & Update Registry Index
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout VoidB Main Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.client_payload.release || '' }}
        run: |
          version="${REQUESTED_VERSION}"
          if [ -z "${version}" ]; then
            echo "::error::No plugin release version provided. Pass the workflow_dispatch 'version' input or send repository_dispatch with client_payload.release. The former hardcoded 'v0.3.4' fallback was removed."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download Verified Published Plugin Archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/download-release-plugins.py --all --version "${RELEASE_VERSION}" --output target/registry-release

      - name: Rebuild Registry From Published Archives
        run: |
          mapfile -t archives < <(find target/registry-release/.downloads -name '*.tar.gz' | sort)
          # Derive the expected archive count from the downloader itself
          # (ALL plugins x TARGETS, 14 x 4 = 56 today) instead of a hardcoded
          # magic number, so adding a plugin or target updates the
          # expectation automatically. The download step above already fails
          # if any expected archive is missing; this guards against staging
          # drift (renamed or nested files).
          expected="$(python3 -c "import importlib.util; spec=importlib.util.spec_from_file_location('download_release_plugins', 'scripts/download-release-plugins.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print(len(module.ALL) * len(module.TARGETS))")"
          if [ "${#archives[@]}" -ne "${expected}" ]; then
            echo "::error::Downloaded ${#archives[@]} plugin archives, expected ${expected} (ALL plugins x TARGETS in scripts/download-release-plugins.py)."
            exit 1
          fi
          cargo run -p voidb-cli -- plugin registry-index "${archives[@]}" --output registry/index.json --registry-name 'VoidB Official Plugin Registry' --format json
        shell: bash

      - name: Validate Registry Manifest with CLI
        run: |
          cargo run -p voidb-cli -- plugin registry list --url file://$(pwd)/registry/index.json
        shell: bash

      - name: Commit & Push Updated Registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/index.json
          if git diff --staged --quiet; then
            echo "No registry changes detected."
          else
            git commit -m "chore(registry): update official plugin index manifest"
            git push origin main
          fi
        shell: bash
