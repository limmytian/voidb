name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit or branch to validate
        required: false
        default: ''
      release_version:
        description: Candidate version (must match source package versions)
        required: true
        default: '0.3.5'
      publish_release:
        description: Publish only after owner review; false uploads candidates without creating tags or releases
        type: boolean
        required: false
        default: false

env:
  RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}

jobs:
  build-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-15
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Build Binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p voidb-tui -p voidb-cli

      - name: Verify Native CLI Version and Help
        run: |
          cli="target/${{ matrix.target }}/release/voidb-cli"
          if [ "${{ runner.os }}" = "Windows" ]; then cli="${cli}.exe"; fi
          test "$("$cli" --version)" = "voidb ${RELEASE_VERSION#v}"
          "$cli" --help
          expected="${RELEASE_VERSION#v}"
          test "$("$cli" --version | awk '{print $NF}')" = "$expected"
        shell: bash

      - name: Package Binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voidb dist/voidb
          cp target/${{ matrix.target }}/release/voidb-cli dist/voidb-cli
          cd dist
          tar -czf voidb-${RELEASE_VERSION#v}-${{ matrix.platform }}.tar.gz voidb voidb-cli
        shell: bash

      - name: Package Binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voidb.exe dist/voidb.exe
          cp target/${{ matrix.target }}/release/voidb-cli.exe dist/voidb-cli.exe
          cd dist
          7z a voidb-${RELEASE_VERSION#v}-${{ matrix.platform }}.zip voidb.exe voidb-cli.exe
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidb-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish-release:
    if: github.event_name == 'push' || inputs.publish_release == true
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
        shell: bash

      - name: Create New Immutable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${RELEASE_VERSION#v}"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
