name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: voidb
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: voidb
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: voidb
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: voidb.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p voidb-cli
          else
            cargo build --release --target ${{ matrix.target }} -p voidb-cli
          fi
        shell: bash

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voidb-cli dist/${{ matrix.artifact_name }}
          cd dist
          tar -czf voidb-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact_name }}
        shell: bash

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voidb-cli.exe dist/${{ matrix.artifact_name }}
          cd dist
          7z a voidb-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.artifact_name }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidb-${{ matrix.target }}
          path: dist/*.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
