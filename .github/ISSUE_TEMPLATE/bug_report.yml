name: Bug Report
description: Create a report to help us improve VoidB
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: VoidB Version
      description: What version of VoidB are you using? (Run `voidb --version` or check binary tag)
      placeholder: e.g. 0.3.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / Plugin
      description: Which area or plugin does this issue affect?
      options:
        - TUI Shell
        - CLI (general)
        - MySQL
        - PostgreSQL
        - SQLite
        - Redis
        - SSH
        - Docker
        - Kubernetes
        - S3 / WebDAV
        - Email
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Enter profile '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS distribution, terminal emulator, etc.
      placeholder: macOS 14.5 / Alacritty / zsh
